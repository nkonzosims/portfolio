server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve app with SPA fallback
  location / {
    # Never cache HTML to ensure clients get latest deploy
    add_header Cache-Control "no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  # Cache immutable assets aggressively (Angular outputs hashed filenames)
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Assets directory (if used), long cache
  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Optional gzip for text assets
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/vnd.ms-fontobject font/ttf font/opentype image/svg+xml;
  gzip_min_length 1024;
}

